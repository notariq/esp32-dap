; ESP32 DAP - PlatformIO project
; Arduino-ESP32 2.x core (espressif32 6.x) is used on purpose: ESP32-audioI2S 2.x
; and ESP32-A2DP both use the legacy I2S driver that this core ships with.
[env:dap]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; LovyanGFX fonts + codecs need more than the default 1.3 MB app partition
board_build.partitions = huge_app.csv

build_flags =
  -DBOARD_HAS_PSRAM
  -mfix-esp32-psram-cache-issue
  -DCORE_DEBUG_LEVEL=1
  -O2

lib_deps =
  lovyan03/LovyanGFX@^1.1.16
  madhephaestus/ESP32Encoder@^0.11.7
  pschatzmann/ESP32-A2DP@^1.8.0
  ; audio decoder: pinned to a 2.x release (callback API changed in 3.x)
  https://github.com/schreibfaul1/ESP32-audioI2S.git#2.0.7
